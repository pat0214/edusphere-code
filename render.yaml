# Deploy this blueprint from the root of the backend repository.
envVarGroups:
  - name: edusphere-notification-worker
    envVars:
      - key: EMAIL_WORKER_TOKEN
        generateValue: true
      - key: API_BASE_URL
        value: https://edusphere-api.onrender.com

services:
  - type: web
    name: edusphere-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/v1/health
    disk:
      name: course-materials
      mountPath: /var/www/html/.data
      sizeGB: 1
    envVars:
      - fromGroup: edusphere-notification-worker
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://edusphere-front.onrender.com
      - key: APP_URL
        value: https://edusphere-front.onrender.com
      - key: DB_DRIVER
        value: mysql
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA
        value: /etc/secrets/aiven-ca.pem
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://edusphere-api.onrender.com/api/v1/classrooms/google/callback
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: JAAS_APP_ID
        sync: false
      - key: JAAS_API_KEY_ID
        sync: false
      - key: JAAS_PRIVATE_KEY
        sync: false
      - key: JITSI_JWT_APP_ID
        sync: false
      - key: JITSI_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SECURE
        value: tls
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: EduSphere
      - key: JUDGE0_URL
        sync: false
  - type: cron
    name: edusphere-notification-email-worker
    runtime: docker
    plan: starter
    schedule: "*/1 * * * *"
    dockerCommand: >-
      sh -c 'curl --fail --silent --show-error --max-time 50 -X POST -H "Authorization: Bearer $EMAIL_WORKER_TOKEN" "$API_BASE_URL/api/v1/internal/notification-email-worker"'
    envVars:
      - fromGroup: edusphere-notification-worker
